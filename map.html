<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>html,body,#m{margin:0;height:100%;font-family:sans-serif}</style></head>
<body><div id="m"></div>
<script>
const map=L.map('m',{zoomControl:true,scrollWheelZoom:false}).setView([-14.235,-51.925],4);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);
const markers=L.layerGroup().addTo(map);
addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='voltura-works')return;markers.clearLayers();const pts=[];(event.data.works||[]).forEach(w=>{if(!Number.isFinite(w.lat)||!Number.isFinite(w.lng))return;pts.push([w.lat,w.lng]);L.circleMarker([w.lat,w.lng],{radius:9,color:'#f97316',weight:2,fillColor:'#f97316',fillOpacity:.35}).addTo(markers).bindTooltip(w.name+' — '+w.status);});if(pts.length)map.fitBounds(pts,{padding:[40,40]});});
</script></body></html>
